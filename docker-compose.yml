services:
  # ============================================================================
  # PostgreSQL — test database (pytest only, never the app)
  #
  # Mirrors the CI container, where the gitops archetype runs a stock
  # postgres:18 with POSTGRES_USER=ci_test (which makes ci_test a SUPERUSER).
  # Plain postgres:18, NOT pgvector — this service's durable job store schema
  # uses no vector type.
  #
  # tmpfs, no persisted app data: a persisted volume is how a stale schema
  # survives across model changes. A named volume is declared below only for
  # parity with the fleet compose shape; the tmpfs mount takes precedence for
  # the live data dir.
  # ============================================================================
  video_compiler_service_test_postgres:
    image: postgres:18
    container_name: video_compiler_service_test_postgres
    environment:
      # Throwaway local-test credentials, not a secret. Must match the local
      # default in scripts/ci-local.sh.
      POSTGRES_USER: ci_test
      POSTGRES_PASSWORD: ci_test # pragma: allowlist secret
      POSTGRES_DB: video_compiler_service_ci
      POSTGRES_INITDB_ARGS: "-E UTF8"
    ports:
      - "5478:5432"
    # postgres:18 keeps data in a versioned subdir (/var/lib/postgresql/18/docker)
    # and REFUSES TO START if you mount over the old /var/lib/postgresql/data path.
    # The image's own guidance is a single mount at /var/lib/postgresql.
    volumes:
      - video_compiler_service_test_postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ci_test -d video_compiler_service_ci"]
      interval: 2s
      timeout: 3s
      retries: 15
    networks:
      - video-compiler-network

# ============================================================================
# Networks
# ============================================================================
networks:
  video-compiler-network:
    driver: bridge

# ============================================================================
# Volumes
# ============================================================================
volumes:
  video_compiler_service_test_postgres_data:
    name: video_compiler_service_test_postgres_data
